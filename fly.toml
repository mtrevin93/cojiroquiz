app = "cojiroquiz"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SITE_URL = "https://cojiroquiz.com"
  FEEDBACK_FROM = "feedback@cojiroquiz.com"
  PARSE_MODEL = "claude-sonnet-5-5"
  # 0 = no site-wide cap on screenshot reads per day
  DAILY_PARSE_CAP = "0"
  AWS_REGION = "auto"
  PUBLIC_IMAGE_BASE_URL = "https://cojiroquiz-images.fly.storage.tigris.dev"

[mounts]
  source = "cojiro_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite lives on one volume, so exactly one machine.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
